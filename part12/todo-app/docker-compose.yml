services:
  server:
    image: todo-backend
    build:
      context: ./todo-backend
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://root:example@mongo:27017/the_database?authSource=admin
    depends_on:
      - redis
      - mongo

  mongo:
    image: mongo
    # ports:
    # - 3456:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: the_database
    volumes:
      - ./todo-backend/mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    # ports:
    # - 6379:6379
    command: ["redis-server", "--appendonly", "yes"] # Overwrite the CMD
    volumes:
      - redis_data:/data

  app:
    image: todo-front
    build:
      context: ./todo-frontend # The context will pick this directory as the "build context"
      dockerfile: Dockerfile # This will simply tell which dockerfile to read
    volumes:
      # あなたが作った nginx.conf をコンテナ内のNginx設定に上書きする
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    depends_on:
      - server
    # volumes:
    #   - frontend_dist:/usr/src/app/dist

  # nginx:
  #   image: nginx:1.29
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - frontend_dist:/usr/share/nginx/html
  #   ports:
  #     - 8080:80
  #   container_name: reverse-proxy
  #   depends_on:
  #     - app # wait for the frontend container to be started
  #     - server # wait for the backend container to be started

  debug-helper:
    image: busybox

volumes:
  mongo_data:
  redis_data:
  frontend_dist: # 追加：ボリュームの定義
